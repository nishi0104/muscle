<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1733">
  <title>マッスルクエスト</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>⚔️ マッスルクエスト</h1>
    <div class="header-lv" id="headerLv">Lv 1</div>
  </header>

  <main>
    <!-- ホーム -->
    <section class="view active" id="view-home" aria-label="ホーム">
      <div class="card hero">
        <div class="avatar" id="avatar">🥚</div>
        <div class="hero-title" id="heroTitle">たまご戦士</div>
        <div class="hero-level">Lv <span id="level">1</span></div>
        <div class="exp-bar" role="progressbar" aria-label="経験値" id="expBarWrap">
          <div class="exp-fill" id="expFill"></div>
        </div>
        <div class="exp-text" id="expText">0 / 0 EXP</div>
        <div class="total-exp">累計 <span id="totalExp">0</span> EXP</div>
      </div>

      <div class="card">
        <h2>🔥 連続記録</h2>
        <div class="stat-row">
          <div class="stat"><div class="stat-num" id="weekCount">0</div><div class="stat-label">今週の日数</div></div>
          <div class="stat"><div class="stat-num" id="streakWeeks">0</div><div class="stat-label">連続達成週</div></div>
          <div class="stat"><div class="stat-num" id="bossKills">0</div><div class="stat-label">ボス撃破</div></div>
        </div>
        <div class="week-dots" id="weekDots"></div>
        <p class="hint" id="weekHint"></p>
        <label class="inline-field">週の目標
          <select id="weeklyGoal">
            <option value="1">1回</option><option value="2">2回</option><option value="3">3回</option>
            <option value="4">4回</option><option value="5">5回</option><option value="6">6回</option><option value="7">7回</option>
          </select>
        </label>
      </div>

      <div class="card">
        <h2>📜 ルール</h2>
        <ul class="rules">
          <li>EXP = 重量 × 回数 × セット数</li>
          <li>PR更新でボス撃破：+<span class="bossBonus"></span> EXP</li>
          <li>週の目標達成：+<span id="weekBonusBase"></span> EXP × 連続週数（最大5倍）</li>
        </ul>
        <button class="btn danger small" id="resetBtn">データを全て削除</button>
      </div>
    </section>

    <!-- 記録 -->
    <section class="view" id="view-log" aria-label="記録">
      <form class="card" id="logForm" autocomplete="off">
        <h2>📝 トレーニング記録</h2>
        <label>日付<input type="date" id="fDate" required></label>
        <label>種目
          <select id="fExercise" required></select>
        </label>
        <div class="grid3">
          <label>重量(kg)<input type="number" id="fWeight" inputmode="decimal" min="0.5" step="0.5" required></label>
          <label>回数<input type="number" id="fReps" inputmode="numeric" min="1" step="1" required></label>
          <label>セット<input type="number" id="fSets" inputmode="numeric" min="1" step="1" value="3" required></label>
        </div>
        <div class="preview" id="expPreview">獲得予定 0 EXP</div>
        <button type="submit" class="btn primary">記録する</button>
      </form>

      <form class="card" id="exForm" autocomplete="off">
        <h2>➕ 種目を追加</h2>
        <div class="row">
          <input type="text" id="exName" placeholder="例：ショルダープレス" maxlength="30" required>
          <button type="submit" class="btn">追加</button>
        </div>
      </form>

      <div class="card">
        <h2>🗂 最近の記録</h2>
        <ul class="history" id="history"></ul>
      </div>
    </section>

    <!-- ボス -->
    <section class="view" id="view-boss" aria-label="ボス">
      <div class="boss-list" id="bossList"></div>
    </section>

    <!-- グラフ -->
    <section class="view" id="view-graph" aria-label="成長グラフ">
      <div class="card">
        <h2>📈 最大重量の推移</h2>
        <select id="graphExercise" aria-label="種目"></select>
        <div class="chart-wrap" id="chartWrap">
          <canvas id="chart"></canvas>
          <div class="tooltip" id="tooltip" hidden></div>
        </div>
        <p class="hint" id="chartEmpty" hidden>この種目の記録はまだありません。</p>
      </div>
    </section>
  </main>

  <nav class="tabbar" aria-label="メニュー">
    <button class="tab active" data-view="home"><span>🏠</span>ホーム</button>
    <button class="tab" data-view="log"><span>📝</span>記録</button>
    <button class="tab" data-view="boss"><span>👹</span>ボス</button>
    <button class="tab" data-view="graph"><span>📈</span>グラフ</button>
  </nav>

  <!-- レベルアップ・撃破演出 -->
  <div class="overlay" id="overlay" hidden>
    <div class="modal" id="modal"></div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="js/storage.js"></script>
  <script src="js/game.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
